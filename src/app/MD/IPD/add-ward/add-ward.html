<form class="ward-form" #wardForm="ngForm" (ngSubmit)="submitWard()">
  <header class="modal-header">
    <div>
      <p>Ward Setup</p>
      <h2 class="modal-title">Add Ward</h2>
    </div>

    <button type="button" class="btn-close" aria-label="Close add ward modal" (click)="closeModal()"></button>
  </header>

  <div class="modal-body">
    <label class="form-field">
      <span>Ward Name</span>
      <input
        type="text"
        name="wardName"
        placeholder="Enter ward name"
        maxlength="60"
        required
        autofocus
        [(ngModel)]="wardName"
      >
    </label>

    @if (errorMessage) {
    <div class="save-error">
      {{ errorMessage }}
    </div>
    }
  </div>

  <footer class="modal-footer modal-actions">
    <button type="button" class="btn btn-light" [disabled]="saving" (click)="closeModal()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="wardForm.invalid || !wardName.trim() || saving">
      @if (saving) {
      Saving...
      } @else {
      Save Ward
      }
    </button>
  </footer>
</form>
