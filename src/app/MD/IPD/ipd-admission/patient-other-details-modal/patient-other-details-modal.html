<section class="other-details-modal">
  <header class="modal-header other-details-header">
    <div>
      <p class="modal-eyebrow">IPD Patient Details</p>
      <h2 class="modal-title">Other Details</h2>
    </div>

    <button type="button" class="btn-close" aria-label="Close other details modal" (click)="activeModal.dismiss()"></button>
  </header>

  <div class="modal-body other-details-body">
    <div class="patient-summary">
      <span class="patient-avatar">{{ getPatientInitials() }}</span>
      <div class="patient-summary-info">
        <small>Selected Patient</small>
        <strong>{{ patient?.name || 'N/A' }}</strong>
        <span>{{ getPatientMeta() }}</span>
      </div>
      <span class="bed-badge">
        <i class="fa-solid fa-bed"></i>
        {{ patient?.bedId || 'Not allocated' }}
      </span>
    </div>

    <div class="details-grid">
      @for (section of sections; track section.key) {
      <section
        class="detail-section"
        [class.tone-blue]="section.tone === 'blue'"
        [class.tone-red]="section.tone === 'red'"
        [class.tone-green]="section.tone === 'green'"
        [class.tone-amber]="section.tone === 'amber'"
      >
        <header class="detail-section-header">
          <span class="section-icon">
            <i [class]="section.icon"></i>
          </span>
          <div class="section-heading">
            <h3>{{ section.title }}</h3>
            <p>{{ section.subtitle }}</p>
          </div>
          <button type="button" class="go-to-action" (click)="goToSection(section)">
            <span>Go To</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </header>

      </section>
      }
    </div>
  </div>

  <footer class="modal-footer other-details-footer">
    <button type="button" class="secondary-modal-action" (click)="activeModal.dismiss()">Close</button>
  </footer>
</section>
