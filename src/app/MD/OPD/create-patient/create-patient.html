<section class="create-patient-page">
  <header class="modal-header page-header">
    <div>
      <p class="eyebrow">OPD Department</p>
      <h1>Add Patient</h1>
    </div>

    <button type="button" class="btn-close" aria-label="Close add patient modal" (click)="closeModal()"></button>
  </header>

  <div class="modal-body patient-modal-body">
    <div class="patient-form">
      <div class="form-section">
        <div class="section-title">
          <span class="section-icon blue">
            <i class="fa-regular fa-user"></i>
          </span>
          <h2>Patient Details</h2>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>Full Name</span>
            <input type="text" name="name" placeholder="Enter patient name" [(ngModel)]="createPatientReq.name" />
          </label>

          <label class="field">
            <span>Mobile Number</span>
            <input type="tel" name="number" placeholder="Enter mobile number" [(ngModel)]="createPatientReq.number" />
          </label>

          <label class="field">
            <span>Age</span>
            <input type="number" name="age" placeholder="Enter age" [(ngModel)]="createPatientReq.age" />
          </label>

          <label class="field">
            <span>Gender</span>
            <select name="gender" [(ngModel)]="createPatientReq.gender">
              <option value="" disabled>Select gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </label>

          <label class="field">
            <span>Date of Birth</span>
            <input type="date" name="dob" [(ngModel)]="createPatientReq.dob" />
          </label>

          <label class="field">
            <span>Blood Group</span>
            <select name="bloodGroup" [(ngModel)]="createPatientReq.bloodGroup">
              <option value="" disabled>Select blood group</option>
              <option>A+</option>
              <option>A-</option>
              <option>B+</option>
              <option>B-</option>
              <option>AB+</option>
              <option>AB-</option>
              <option>O+</option>
              <option>O-</option>
            </select>
          </label>

          <label class="field full-width">
            <span>Address</span>
            <textarea name="address" rows="3" placeholder="Enter patient address"
              [(ngModel)]="createPatientReq.address"></textarea>
          </label>
        </div>
      </div>

      <div class="form-section">
        <div class="section-title">
          <span class="section-icon red">
            <i class="fa-solid fa-phone-volume"></i>
          </span>
          <h2>Emergency Contact</h2>
        </div>

        <div class="form-grid">
          <label class="field">
            <span>Contact Name</span>
            <input type="text" name="emergencyContactName" placeholder="Enter contact name"
              [(ngModel)]="createPatientReq.emergencyContactName" />
          </label>

          <label class="field">
            <span>Relation</span>
            <input type="text" name="emergencyContactRelation" placeholder="Enter relation"
              [(ngModel)]="createPatientReq.emergencyContactRelation" />
          </label>

          <label class="field">
            <span>Contact Number</span>
            <input type="tel" name="emergencyContactNumber" placeholder="Enter contact number"
              [(ngModel)]="createPatientReq.emergencyContactNumber" />
          </label>
        </div>
      </div>

      @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
      }

      <div class="form-actions">
        <button type="button" class="secondary-action" (click)="closeModal()">Cancel</button>
        <button type="submit" class="primary-action" [disabled]="saving" (click)="savePatient()">
          <i class="fa-regular fa-floppy-disk"></i>
          <span>{{ saving ? 'Saving...' : 'Save Patient' }}</span>
        </button>
      </div>
    </div>
  </div>
</section>
