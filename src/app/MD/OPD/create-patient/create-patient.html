<section class="create-patient-page">
  <div class="page-header">
    <div>
      <p class="eyebrow">OPD Department</p>
      <h1>Add Patient</h1>
    </div>

    <button type="button" class="ghost-action" routerLink="/opd">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back</span>
    </button>
  </div>

  <form class="patient-form">
    <div class="form-section">
      <div class="section-title">
        <span class="section-icon blue">
          <i class="fa-regular fa-user"></i>
        </span>
        <h2>Patient Details</h2>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>Full Name</span>
          <input type="text" placeholder="Enter patient name" />
        </label>

        <label class="field">
          <span>Mobile Number</span>
          <input type="tel" placeholder="Enter mobile number" />
        </label>

        <label class="field">
          <span>Age</span>
          <input type="number" placeholder="Enter age" />
        </label>

        <label class="field">
          <span>Gender</span>
          <select>
            <option selected disabled>Select gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </label>

        <label class="field">
          <span>Date of Birth</span>
          <input type="date" />
        </label>

        <label class="field">
          <span>Blood Group</span>
          <select>
            <option selected disabled>Select blood group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
          </select>
        </label>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">
        <span class="section-icon green">
          <i class="fa-solid fa-stethoscope"></i>
        </span>
        <h2>Visit Details</h2>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>OPD Number</span>
          <input type="text" value="OPD-1029" />
        </label>

        <label class="field">
          <span>Visit Date</span>
          <input type="date" />
        </label>

        <label class="field">
          <span>Visit Time</span>
          <input type="time" />
        </label>

        <label class="field">
          <span>Consulting Doctor</span>
          <select>
            <option selected disabled>Select doctor</option>
            <option>Dr. Meera Shah</option>
            <option>Dr. Ravi Desai</option>
            <option>Dr. Anil Mehta</option>
          </select>
        </label>

        <label class="field">
          <span>Department</span>
          <select>
            <option selected>OPD</option>
            <option>General Medicine</option>
            <option>Orthopedic</option>
            <option>Dermatology</option>
          </select>
        </label>

        <label class="field">
          <span>Priority</span>
          <select>
            <option selected>Normal</option>
            <option>Urgent</option>
            <option>Critical</option>
          </select>
        </label>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">
        <span class="section-icon amber">
          <i class="fa-solid fa-notes-medical"></i>
        </span>
        <h2>Medical Information</h2>
      </div>

      <div class="form-grid">
        <label class="field full-width">
          <span>Symptoms</span>
          <textarea rows="4" placeholder="Enter symptoms"></textarea>
        </label>

        <label class="field">
          <span>Allergies</span>
          <input type="text" placeholder="Enter allergies" />
        </label>

        <label class="field">
          <span>Current Medication</span>
          <input type="text" placeholder="Enter medication" />
        </label>

        <label class="field full-width">
          <span>Address</span>
          <textarea rows="3" placeholder="Enter patient address"></textarea>
        </label>
      </div>
    </div>

    <div class="form-section">
      <div class="section-title">
        <span class="section-icon red">
          <i class="fa-solid fa-phone-volume"></i>
        </span>
        <h2>Emergency Contact</h2>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>Contact Name</span>
          <input type="text" placeholder="Enter contact name" />
        </label>

        <label class="field">
          <span>Relation</span>
          <input type="text" placeholder="Enter relation" />
        </label>

        <label class="field">
          <span>Contact Number</span>
          <input type="tel" placeholder="Enter contact number" />
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="secondary-action" routerLink="/opd">Cancel</button>
      <button type="button" class="primary-action">
        <i class="fa-regular fa-floppy-disk"></i>
        <span>Save Patient</span>
      </button>
    </div>
  </form>
</section>
