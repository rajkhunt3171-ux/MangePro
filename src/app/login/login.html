<div class="login-wrapper">
    <div class="login-shell">
        <div class="login-filter-panel">
            <div class="filter-heading">
                <span>Access Area</span>
                <strong>Choose Department</strong>
            </div>

            <div class="form-group">
                <label class="filter-label" for="department">
                    <span>Department</span>
                </label>
                <div class="select-control">
                    <select class="input-field select-field" id="department" name="department"
                        [(ngModel)]="selectedDepartment">
                        @for (department of departments; track department.value) {
                        <option [ngValue]="department.value">{{ department.label }}</option>
                        }
                    </select>
                </div>
            </div>
        </div>

        <div class="login-card">
            <div class="header-section">
                <img src="../../assets/img/logo_new.png" alt="">
                <p>Please sign in to your account</p>
            </div>
            @if(selectedDepartment === 0){
            <div class="body-section">
                <div class="form-section">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input class="input-field" type="text" id="email" placeholder="Enter your email"
                            [(ngModel)]="loginReq.email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input class="input-field" type="password" id="password" placeholder="Enter your password"
                            [(ngModel)]="loginReq.password">
                    </div>
                </div>
            </div>
            } @else if(selectedDepartment === 1){
            <div class="body-section">
                <div class="form-section">
                    <div class="form-group">
                        <label for="doctorId">Doctor ID</label>
                        <input class="input-field" type="text" id="doctorId" placeholder="Enter doctor ID"
                            [(ngModel)]="loginReq.username">
                    </div>
                    <div class="form-group">
                        <label for="doctorPassword">Password</label>
                        <input class="input-field" type="password" id="doctorPassword" placeholder="Enter your password"
                            [(ngModel)]="loginReq.password">
                    </div>
                </div>
            </div>
            }
            <div class="footer-section">
                <div class="submit-btn">
                    <div class="secondary-btn" (click)="loginBtnCredentials()">Sign In</div>
                </div>
            </div>
        </div>
    </div>
</div>
