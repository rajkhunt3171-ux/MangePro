<div class="sidebar-wrapper">
    <div class="sidebar-main">
        <div class="sidebar-brand">
            <img src="../../../../assets/img/logo_new.png" routerLink="/" alt="">
        </div>
        <nav class="sidebar-nav">
            <a class="sidebar-link" routerLink="/">
                <i class="fa-solid fa-house"></i>
                <span class="sidebar-text">Dashboard</span>
            </a>
            <a class="sidebar-link" routerLink="/chat">
                <i class="fa-solid fa-comments"></i>
                <span class="sidebar-text">Chat</span>
            </a>
            @if(sharedService?.userDetails?.role=="cd"){
            <a *ngFor="let item of coreDepartment" class="sidebar-link" [routerLink]="item.url">
                <i class="{{ item?.icon }}"></i>
                <span class="sidebar-text">{{ item.name }}</span>
            </a>
            }@else if (sharedService?.userDetails?.role=="md") {
            <a *ngFor="let item of medicalDepartment" class="sidebar-link" [routerLink]="item.url">
                <i class="{{ item?.icon }}"></i>
                <span class="sidebar-text">{{ item.name }}</span>
            </a>
            }
        </nav>
        <div class="sidebar-user-details">
            <h1>{{ sharedService?.userDetails?.username }}</h1>
            <p><b>Department : </b>{{sharedService?.userDepartment?.name}}</p>
        </div>
    </div>
</div>
