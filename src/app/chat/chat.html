<div class="chat-container">
  <!-- MESSAGES -->

  <div class="messages">
    <div

      *ngFor="
        let msg of messages()
      "

      [class.my-message]="
        msg.senderId === userId()
      "

      [class.other-message]="
        msg.senderId !== userId()
      "
    >

      {{ msg.message }}

    </div>

  </div>



  <!-- INPUT -->

  <div class="input-box">

    <input
      type="text"

      [ngModel]="message()"

      (ngModelChange)="message.set($event)"

      placeholder="Type message..."
    >

    <button
      (click)="sendMessage()"
    >
      Send
    </button>

  </div>

</div>
